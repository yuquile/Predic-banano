<!DOCTYPE html>
<html lang="es" data-theme="agrotech">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BananoSys - Crear Cuenta</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  
  <!-- Estilos Globales y de la Página -->
  <link rel="stylesheet" href="../css/theme-variables.css">
  <link rel="stylesheet" href="../css/pages/registrar.css">
  
  <script src="../js/theme-manager.js"></script>
</head>
<body>

  <div class="main-container">
    
    <!-- ==========================================
         PANEL IZQUIERDO (Branding + Mockup)
         ========================================== -->
    <div class="left-panel">
      
      
      <div class="bg-icons-container">
        <!-- Hoja 1 -->
        <svg class="bg-icon bg-icon-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2c-3.1 0-8.9 1.4-12 5-2.7 3.2-3.7 7.5-3 11l-4 4 1.4 1.4 4-4c3.5.7 7.8-.3 11-3 3.6-3.1 5-8.9 5-12a1 1 0 0 0-1-1Z"></path>
          <path d="M10 14c2.5-2.5 5.5-4 8-4"></path>
        </svg>
        <!-- Banano 1 -->
        <svg class="bg-icon bg-icon-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 13c3.5-2 8-2 10 2a9.5 9.5 0 0 1 8 5"></path>
          <path d="M5.15 17.89c5.52-1.52 8.65-6.89 7-12C11.55 4 11.5 2 13 2c3.22 0 5 5.5 5 8 0 6.5-4.2 12-10.49 12C5.11 22 2 22 2 20c0-1.5 1.14-1.55 3.15-2.11Z"></path>
        </svg>
        <!-- Planta/Palmera -->
        <svg class="bg-icon bg-icon-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22v-9"></path><path d="M12 13c-2-2-4.5-2-7 0a6 6 0 0 0-3 6"></path><path d="M12 13c2-2 4.5-2 7 0a6 6 0 0 1 3 6"></path><path d="M12 13c-3-1-6-1-8 2"></path><path d="M12 13c3-1 6-1 8 2"></path>
        </svg>
        <!-- Hoja 2 -->
        <svg class="bg-icon bg-icon-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2c-3.1 0-8.9 1.4-12 5-2.7 3.2-3.7 7.5-3 11l-4 4 1.4 1.4 4-4c3.5.7 7.8-.3 11-3 3.6-3.1 5-8.9 5-12a1 1 0 0 0-1-1Z"></path>
        </svg>
        <!-- Banano 2 -->
        <svg class="bg-icon bg-icon-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 13c3.5-2 8-2 10 2a9.5 9.5 0 0 1 8 5"></path>
          <path d="M5.15 17.89c5.52-1.52 8.65-6.89 7-12C11.55 4 11.5 2 13 2c3.22 0 5 5.5 5 8 0 6.5-4.2 12-10.49 12C5.11 22 2 22 2 20c0-1.5 1.14-1.55 3.15-2.11Z"></path>
        </svg>
      </div>
      
      <!-- Ondas SVG en HTML en vez de ::before CSS -->
      <svg class="waves-bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="var(--verde-oscuro, #164e3b)" fill-opacity="0.3" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,197.3C672,192,768,160,864,154.7C960,149,1056,171,1152,186.7C1248,203,1344,213,1392,218.7L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        <path fill="var(--verde-oscuro, #164e3b)" fill-opacity="0.5" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,133.3C672,117,768,139,864,165.3C960,192,1056,224,1152,224C1248,224,1344,192,1392,176L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        <path fill="var(--verde-oscuro, #164e3b)" fill-opacity="1" d="M0,288L48,272C96,256,192,224,288,197.3C384,171,480,149,576,165.3C672,181,768,235,864,250.7C960,267,1056,245,1152,250.7C1248,256,1344,288,1392,304L1440,320L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
      </svg>

      <!-- Phone Mockup con CSS -->
      <div class="phone-mockup">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="mini-login">
            <div class="mini-logo-container">
              <img src="../assets/img/logo/imagen.png" alt="Mini Logo" class="mini-logo-img">
              <div class="mini-title">BananoSys</div>
            </div>
            
            <div class="mini-input"></div>
            <div class="mini-input"></div>
            <div class="mini-btn"></div>
          </div>
        </div>
      </div>
      
    </div>

    <!-- ==========================================
         PANEL DERECHO (Formulario de Registro)
         ========================================== -->
    <div class="right-panel">
      
      <div class="form-header">
        <div class="logo-container">
          <img src="../assets/img/logo/imagen.png" alt="Logo BananoSys" class="logo-img">
          <h1 class="app-title">BananoSys</h1>
        </div>
        <p class="app-subtitle">Predicción Inteligente de Cosecha</p>
        
        <!-- Indicador decorativo -->
        <div class="page-indicator">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
          Crear Nueva Cuenta
        </div>
      </div>

      <!-- Formulario -->
      <div class="form-group">
        <label for="email" class="sr-only" style="display:none;">Correo Electrónico</label>
        <div class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </div>
        <input type="email" id="email" placeholder="usuario@email.com" required aria-label="Correo Electrónico"/>
      </div>

      <div class="form-group">
        <label for="password" class="sr-only" style="display:none;">Contraseña</label>
        <div class="password-group">
          <div class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <input type="password" id="password" placeholder="Contraseña (mín. 6 caracteres)" required aria-label="Contraseña" />
          
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button id="registerBtn" disabled>
        Crear Mi Cuenta
      </button>

      <!-- Beneficios Grid inyectado desde JS -->
      <div class="benefits-divider">
        <span>Tu cuenta incluye</span>
      </div>
      
      <div id="benefits-grid"></div>

      <!-- Enlace Login -->
      <div class="footer-text">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
      </div>
      
    </div>
  </div>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Lógica y renderizado de la página -->
  <script type="module" src="../js/pages/registrar.js"></script>

</body>
</html>
