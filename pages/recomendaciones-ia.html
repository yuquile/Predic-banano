<!DOCTYPE html>
<html lang="es" data-theme="agrotech">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recomendaciones IA - BananoSys</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Marked.js para renderizar Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Custom Base Styles -->
  <link rel="stylesheet" href="../css/pages/dashboard.css?v=6.0" />
  <style>
    /* Estilos específicos para el Chat IA */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 220px);
      min-height: 400px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message-bubble {
      max-width: 85%;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .message-user {
      align-self: flex-end;
      background-color: var(--primary);
      color: white;
      border-bottom-right-radius: 0;
    }
    .message-ai {
      align-self: flex-start;
      background-color: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0;
    }
    
    /* Markdown Styles */
    .message-ai h1, .message-ai h2, .message-ai h3 {
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }
    .message-ai p { margin-bottom: 0.75rem; }
    .message-ai p:last-child { margin-bottom: 0; }
    .message-ai ul, .message-ai ol { margin-left: 1.5rem; margin-bottom: 0.75rem; }
    .message-ai li { margin-bottom: 0.25rem; list-style-type: disc; }
    .message-ai strong { font-weight: 600; color: #000; }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 8px;
      align-items: center;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: #94a3b8;
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    
    .chat-input-area {
      padding: 1rem;
      border-top: 1px solid var(--border);
      background-color: white;
      border-radius: 0 0 0.5rem 0.5rem;
    }
  </style>

  <!-- Tema Global -->
  <link rel="stylesheet" href="../css/theme-variables.css">
  <script src="../js/theme-manager.js"></script>
</head>
<body class="bg-base">
  
  <div class="flex flex-col min-h-[100dvh] w-full box-border">
    
    <!-- Topbar Simple -->
    <header class="flex flex-wrap items-center justify-between gap-4 px-4 md:px-8 py-4 shrink-0" style="background-color: #ffffff; border-bottom: 1px solid #E8E0D5; position: sticky; top: 0; z-index: 10;">
      <div class="flex-1" style="min-width: 280px;">
        <h1 style="font-family: 'Merriweather', Georgia, serif; font-size: clamp(1.1rem, 2.5vw, 1.25rem); font-weight: 400; color: var(--text); letter-spacing: -0.02em; line-height: 1.3;">
          Análisis de Inteligencia Artificial
        </h1>
        <div style="font-size: 12px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px;">
          Llama 3 Local — Análisis de Cultivos
        </div>
      </div>

      <div class="flex items-center gap-3 shrink-0">
        <button onclick="window.location.href='dashboard.html'" class="flex items-center gap-2 px-4 py-2 rounded" style="background-color: var(--surface); border: 1px solid var(--border); color: var(--text-soft); font-size: 14px; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.backgroundColor='var(--border)'" onmouseout="this.style.backgroundColor='var(--surface)'">
          <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
          Volver al Dashboard
        </button>
      </div>
    </header>

      <main class="flex-1 px-4 md:px-8 py-6 flex flex-col gap-6">
        
        <!-- Header Section -->
        <section class="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h2 style="font-family: 'Merriweather', Georgia, serif; font-size: 18px; color: var(--text);">Asistente Agrónomo Local</h2>
            <p class="text-sm text-muted mt-1">Chat interactivo impulsado por Ollama para análisis de plagas, inventario y recomendaciones.</p>
          </div>
          <button id="btnNewChat" class="flex items-center gap-2 px-4 py-2 rounded bg-primary text-white font-medium hover:bg-primary-light transition-colors text-sm">
            <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
            Nuevo Análisis
          </button>
        </section>

        <!-- Chat Panel -->
        <section class="card flex flex-col chat-container">
          <div id="chatMessages" class="chat-messages">
            <!-- Messages will be injected here -->
          </div>
          
          <div class="chat-input-area">
            <div id="errorAlert" class="hidden mb-3 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded flex items-start gap-2">
              <i data-lucide="alert-circle" style="width:16px; height:16px; flex-shrink: 0; margin-top: 2px;"></i>
              <span id="errorText"></span>
            </div>
            
            <form id="chatForm" class="flex gap-3">
              <input type="text" id="chatInput" placeholder="Pregúntale algo sobre el estado de la finca..." class="flex-1 px-4 py-2 rounded border border-gray-300 focus:outline-none focus:border-primary transition-colors text-sm" autocomplete="off" disabled>
              <button type="submit" id="btnSend" class="flex items-center justify-center px-4 py-2 rounded bg-primary text-white hover:bg-primary-light transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <i data-lucide="send" style="width: 18px; height: 18px;"></i>
              </button>
            </form>
          </div>
        </section>

      </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
  <script type="module" src="../js/core/firebase.js"></script>
  <script type="module">
    import { auth } from '../js/core/firebase.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    document.addEventListener('DOMContentLoaded', function() {
      onAuthStateChanged(auth, (user) => {
        if (!user) {
          window.location.href = 'login.html';
        }
      });
    });
  </script>
  <script type="module" src="../js/ia/recomendaciones-ia-ui.js"></script>
</body>
</html>
