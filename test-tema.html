<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BananoSys — Test Tema Standalone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- 1. Enlazamos el archivo CSS global de paletas -->
<link rel="stylesheet" href="css/theme-variables.css">

<!-- 2. Enlazamos el manejador JS -->
<script src="js/theme-manager.js"></script>

<!-- Estilos base replicados de la demo para confirmar funcionamiento -->
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; padding:32px 20px; transition:background .4s ease;
  }
  .wrap{ max-width:600px; margin:0 auto; }

  /* Selector de paletas (estructura replicada de diseño visual) */
  .switcher{
    display:flex; gap:10px; flex-wrap:wrap; margin:26px 0 34px;
  }
  .switcher button{
    font-family:'Outfit',sans-serif; font-weight:600; font-size:14px;
    padding:10px 18px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--surface); backdrop-filter:blur(10px); color:var(--text);
    cursor:pointer; transition:all .25s ease; display:flex; align-items:center; gap:8px;
  }
  .switcher button .dot{ width:10px; height:10px; border-radius:50%; background:var(--primary); }
  .switcher button.active{
    background:var(--primary); color:#fff; border-color:var(--primary);
    box-shadow:0 8px 20px -8px color-mix(in srgb, var(--primary) 60%, transparent);
  }
  .switcher button.active .dot{ background:#fff; }
  .switcher button:hover:not(.active){ transform:translateY(-1px); }

  .demo-box {
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px; backdrop-filter:blur(10px); text-align:center;
  }
  .demo-box h2 { color: var(--primary); }
  .tag { background: var(--success); color: white; padding: 4px 8px; border-radius: 8px; font-size: 12px; display: inline-block; margin-top: 10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Test Standalone</h1>
  <p>Verificando que los temas funcionen aisladamente antes de integrarlos.</p>

  <div class="switcher" id="switcher">
    <!-- Replicado manualmente o por JS como en la demo, para testing -->
  </div>

  <div class="demo-box">
    <h2>Caja de prueba Glassmorphism</h2>
    <p style="color: var(--text-soft)">Este texto usa la variable --text-soft.</p>
    <div class="tag">Éxito (--success)</div>
  </div>
</div>

<script>
// JS para inyectar botones en el test (similar a la demo de diseño)
const switcherEl = document.getElementById('switcher');

const themes = {
  modern: { name: "1 · Modern Glass" },
  agrotech: { name: "2 · AgroTech IA" },
  harvest: { name: "3 · Banana Harvest" }
};

function selectTestTheme(key){
  setTheme(key);
  // Actualizar UI
  [...switcherEl.children].forEach(btn=> btn.classList.toggle('active', btn.dataset.key===key));
  // También actualizar el "dot" basándose en el CSS calculable
  setTimeout(() => {
    [...switcherEl.children].forEach(btn => {
      const dot = btn.querySelector('.dot');
      if(dot && !btn.classList.contains('active')) {
         // El background depende de CSS ahora
         dot.style.background = 'var(--primary)';
      }
    });
  }, 10);
}

Object.entries(themes).forEach(([key,p])=>{
  const btn = document.createElement('button');
  btn.dataset.key = key;
  btn.innerHTML = `<span class="dot" style="background:var(--primary)"></span>${p.name}`;
  btn.onclick = ()=> selectTestTheme(key);
  switcherEl.appendChild(btn);
});

// Set active based on initial load
const curr = document.documentElement.getAttribute('data-theme') || 'modern';
selectTestTheme(curr);
</script>
</body>
</html>
